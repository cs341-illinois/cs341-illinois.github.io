<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forensic VM 447 — Windows 11 (snapshot)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="vm">

  <div id="start-screen">
    <div class="start-card">
      <div class="start-badge">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="#4cc2ff" d="M3 3h8.5v8.5H3zM12.5 3H21v8.5h-8.5zM3 12.5h8.5V21H3zM12.5 12.5H21V21h-8.5z"/></svg>
      </div>
      <h1>Forensic VM 447</h1>
      <p class="start-sub">Windows 11 Pro &mdash; forensic snapshot (read-only)</p>
      <p class="start-meta">Image: <code>forensic-vm447.img</code> &middot; No network adapter attached</p>
      <button id="start-vm-btn" disabled>Start VM image</button>
      <p id="start-status" class="start-status">Loading image data&hellip;</p>
    </div>
  </div>

  <div id="boot-screen" class="hidden">
    <div class="boot-logo">
      <svg viewBox="0 0 24 24" width="96" height="96"><path fill="#4cc2ff" d="M3 3h8.5v8.5H3zM12.5 3H21v8.5h-8.5zM3 12.5h8.5V21H3zM12.5 12.5H21V21h-8.5z"/></svg>
    </div>
    <div class="spinner"></div>
  </div>

  <div id="login-screen" class="hidden">
    <div class="login-bg"></div>
    <img class="login-art" src="assets/drone-schematic.svg" alt="" aria-hidden="true">
    <div id="login-card" class="login-card">
      <div class="login-avatar" id="login-avatar"></div>
      <div class="login-name" id="login-name"></div>
      <div class="login-email" id="login-email"></div>
      <div class="login-user-row">
        <input id="login-user" type="text" readonly spellcheck="false" autocomplete="username" aria-label="Username">
      </div>
      <div class="login-error hidden" id="login-error">The password is incorrect. Try again.</div>
      <div class="login-input-row">
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
        <button id="login-submit" aria-label="Sign in">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button class="login-options" id="login-options">Sign-in options</button>
      <div class="login-note hidden" id="login-note">Other sign-in methods are unavailable on this device.</div>
    </div>
    <div class="login-corner left">
      <svg viewBox="0 0 24 24" width="17" height="17"><path d="M2 8.5C8 3 16 3 22 8.5M5 12c4-3.8 10-3.8 14 0M8.5 15.4c2-1.9 5-1.9 7 0" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Not connected</span>
    </div>
    <button class="login-corner" id="login-power" title="Power">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M6.6 6.2a7.5 7.5 0 1 0 10.8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <div id="welcome-screen" class="hidden">
    <div class="login-bg"></div>
    <img class="login-art" src="assets/drone-schematic.svg" alt="" aria-hidden="true">
    <div class="welcome-text">Welcome</div>
    <div class="spinner"></div>
  </div>

  <div id="desktop" class="hidden">
    <div id="wallpaper"></div>
    <img id="wallpaper-art" src="assets/drone-schematic.svg" alt="" aria-hidden="true">

    <div id="desktop-icons"></div>

    <div id="windows"></div>

    <div id="start-menu" class="hidden">
      <div class="sm-search"><input id="sm-search-input" type="text" placeholder="Search for apps, settings, and documents" spellcheck="false"></div>
      <div class="sm-section-label">Pinned</div>
      <div id="sm-pinned" class="sm-pinned"></div>
      <div class="sm-footer">
        <div class="sm-user">
          <span id="sm-avatar" class="sm-avatar"></span>
          <span id="sm-username">User</span>
        </div>
        <button id="sm-power" title="Power">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M6.6 6.2a7.5 7.5 0 1 0 10.8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </div>

    <div id="quick-settings" class="hidden">
      <div class="qs-grid">
        <button class="qs-tile" id="qs-wifi">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 8.5C8 3 16 3 22 8.5M5 12c4-3.8 10-3.8 14 0M8.5 15.4c2-1.9 5-1.9 7 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Wi-Fi<br><em>Not connected</em></span>
        </button>
        <button class="qs-tile off">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 7l10 10M12 2a3 3 0 0 1 3 3v5M9 9v3l-4 4h8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Bluetooth<br><em>Off</em></span>
        </button>
        <button class="qs-tile off">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10.5 13.5L21 3M2 14l3-3 11 8-2 3-5-3H6l-2-2z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Airplane mode<br><em>Off</em></span>
        </button>
        <button class="qs-tile off">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
          <span>Battery saver<br><em>Off</em></span>
        </button>
      </div>
      <div class="qs-slider">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/></svg>
        <input type="range" min="0" max="100" value="70">
      </div>
      <div class="qs-slider">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
        <input type="range" min="0" max="100" value="40">
      </div>
      <div class="qs-footer"><span id="qs-battery-label">Battery &mdash; 87%</span></div>
    </div>

    <div id="taskbar">
      <div class="tb-center">
        <button class="tb-icon" id="tb-start" title="Start">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#4cc2ff" d="M3 3h8.5v8.5H3zM12.5 3H21v8.5h-8.5zM3 12.5h8.5V21H3zM12.5 12.5H21V21h-8.5z"/></svg>
        </button>
        <button class="tb-icon" id="tb-search" title="Search">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="tb-tray">
        <button class="tb-tray-group" id="tb-tray-group" title="No internet connection">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M2 8.5C8 3 16 3 22 8.5M5 12c4-3.8 10-3.8 14 0M8.5 15.4c2-1.9 5-1.9 7 0" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/></svg>
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="8" width="17" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="4" y="10" width="11" height="4" fill="currentColor"/><path d="M21 10.5v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="tb-clock">
          <div id="clock-time">--:--</div>
          <div id="clock-date">--/--/----</div>
        </div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

</div>
<noscript>This simulation requires JavaScript.</noscript>
<script src="js/vm.js"></script>
</body>
</html>
